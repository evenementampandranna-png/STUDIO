<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Espace organisateur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --vin: #7a1f2b; --vin-clair: #f4e6e6; --papier: #faf6f0; --carte: #ffffff; --ligne: #eadfd3; --texte: #2b2124; --gris: #75696b; --vert: #2e7d32; --vert-clair: #e8f4e9; --rouge: #a3242b; --rouge-clair: #fbeaea; --ambre: #9a6a12; --ambre-clair: #fbf3e2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--papier); color: var(--texte); font: 15px/1.45 Inter, system-ui, sans-serif; }
  header { background: var(--vin); color: #fff; padding: 22px 16px 26px; }
  header .bloc, main { max-width: 980px; margin: 0 auto; }
  header small { opacity: .8; letter-spacing: .08em; text-transform: uppercase; font-size: 11.5px; font-weight: 600; }
  header h1 { font: 700 28px/1.15 'Cormorant Garamond', serif; margin: 6px 0 4px; }
  header p { margin: 0; opacity: .85; font-size: 14px; }
  main { padding: 0 16px 60px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: -16px 0 16px; }
  .stat { background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 12px 14px; box-shadow: 0 4px 14px rgba(60, 20, 20, .06); }
  .stat b { display: block; font-size: 26px; line-height: 1.1; }
  .stat span { color: var(--gris); font-size: 12.5px; }
  .stat.vient b { color: var(--vert); } .stat.non b { color: var(--rouge); } .stat.attente b { color: var(--ambre); }
  .onglets { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; border-bottom: 1px solid var(--ligne); margin-bottom: 12px; }
  .onglets button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; font: 600 14px Inter, sans-serif; color: var(--gris); cursor: pointer; }
  .onglets button.actif { color: var(--vin); border-color: var(--vin); }
  .outils { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .outils input[type=search] { flex: 1 1 200px; }
  input, select, textarea { font: inherit; padding: 9px 11px; border: 1px solid var(--ligne); border-radius: 10px; background: #fff; color: var(--texte); min-width: 0; }
  textarea { width: 100%; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--ligne); background: #fff; color: var(--texte); border-radius: 999px; padding: 8px 14px; font: 600 13.5px Inter, sans-serif; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn.plein { background: var(--vin); border-color: var(--vin); color: #fff; }
  .btn.petit { padding: 5px 10px; font-size: 12.5px; }
  .btn.wa { background: #1f9d55; border-color: #1f9d55; color: #fff; }
  .btn.danger { color: var(--rouge); }
  .puces { display: flex; gap: 6px; flex-wrap: wrap; }
  .puce { border: 1px solid var(--ligne); background: #fff; border-radius: 999px; padding: 5px 11px; font: 500 12.5px Inter, sans-serif; cursor: pointer; color: var(--gris); }
  .puce.actif { background: var(--vin); border-color: var(--vin); color: #fff; }
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .fam { background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
  .fam .nom { font-weight: 700; font-size: 15.5px; }
  .fam .details { color: var(--gris); font-size: 13px; }
  .fam .actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .badge.vient { background: var(--vert-clair); color: var(--vert); } .badge.non { background: var(--rouge-clair); color: var(--rouge); } .badge.attente { background: var(--ambre-clair); color: var(--ambre); }
  .rep { background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 10px 14px; }
  .rep .haut { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .vide { color: var(--gris); padding: 28px; text-align: center; background: var(--carte); border: 1px dashed var(--ligne); border-radius: 14px; }
  .carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 14px; margin-top: 16px; }
  .carte h3 { margin: 0 0 6px; font-size: 15px; }
  .muet { color: var(--gris); font-size: 13px; }
  .cat-ligne { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(30, 10, 10, .45); }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  dialog h3 { margin: 0; font: 700 22px 'Cormorant Garamond', serif; }
  dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--gris); }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(80px); background: #2b2124; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; transition: transform .25s; z-index: 50; max-width: calc(100vw - 32px); }
  #toast.vu { transform: translateX(-50%) translateY(0); }
  #erreur { max-width: 520px; margin: 60px auto; padding: 0 16px; text-align: center; }
  .etat-sync { font-size: 12px; color: var(--gris); margin-left: auto; }
  @media (max-width: 560px) { header h1 { font-size: 24px; } .stat b { font-size: 22px; } }
  .tables-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
  .table-carte { margin: 0; }
  .table-carte .haut { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .table-carte .haut b { font-size: 18px; }
  .table-carte .tl { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 14px; padding: 2px 0; }
  .table-carte select { width: 100%; margin-top: 6px; }
  #indispo { max-width: 640px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 22px 24px; box-shadow: 0 6px 24px rgba(0,0,0,.08); line-height: 1.5; }
  #indispo h2 { margin: 0 0 8px; font-size: 22px; }
  .cartes-inv { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .cartes-inv .carte { margin-top: 0; }
  .cats-grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .cat-carte { text-align: left; background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 10px 14px; cursor: pointer; font: inherit; color: var(--texte); }
  .cat-carte b { display: block; font: 700 17px 'Cormorant Garamond', serif; text-transform: uppercase; letter-spacing: .02em; }
  .cat-carte span { color: var(--gris); font-size: 12.5px; }
  .cat-carte.actif { border-color: var(--vin); box-shadow: 0 0 0 2px var(--vin) inset; }
  .salle { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; padding: 10px 0; }
  .salle-table { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .salle-table .rond { width: 92px; height: 92px; border-radius: 50%; border: 3px solid var(--ligne); background: var(--carte); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .salle-table .rond b { font-size: 22px; } .salle-table .rond span { font-size: 12px; color: var(--gris); }
  .salle-table.plein .rond { border-color: var(--vert); } .salle-table.trop .rond { border-color: var(--rouge); }
  .salle-table .noms { font-size: 12px; color: var(--gris); line-height: 1.35; }
  @media print { header .outils, .onglets, .outils, .cartes-inv, .cats-grille, .stats, #toast { display: none !important; } }
  .lien-fam { background: #f6efe6; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--gris); }
  .lien-fam small { font-weight: 400; }
</style>
</head>
<body>
<header><div class="bloc"><small>Espace organisateur · privé</small><h1 id="titre">Chargement…</h1><p id="sous-titre"></p></div></header>
<div id="indispo" hidden></div>
<main id="app"></main>
<div id="erreur" hidden></div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast"></div>
<script src="../config.js?v=202611111701"></script>
<script src="../moteur/base.js?v=202611111701"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
(async function () {
  const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let tt, toastFixe = 0; const toast = (t, ms) => { if (Date.now() < toastFixe) return; const e = $('#toast'); e.textContent = t; e.classList.add('vu'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('vu'), ms || 2600); };
  const erreur = t => { $('#app').hidden = true; const e = $('#erreur'); e.hidden = false; e.innerHTML = t; $('#titre').textContent = 'Espace organisateur'; };
  const q = new URLSearchParams(location.search);
  const slug = q.get('p'), cle = decodeURIComponent((location.hash || '').slice(1));
  if (!slug || !cle) return erreur('<h2>Lien incomplet</h2><p class="muet">Ouvrez le lien organisateur complet reçu du studio (il se termine par une longue clé après le signe #).</p>');

  /* ---- L'invitation publiée (titre, langue, base) ---- */
  let projet = null;
  try { const r = await fetch('../projets/' + encodeURIComponent(slug) + '.json?v=' + Date.now()); if (r.ok) projet = await r.json(); } catch (e) {}
  if (!projet) return erreur('<h2>Invitation introuvable</h2><p class="muet">L\'invitation n\'est pas encore publiée, ou le lien est incorrect.</p>');
  const conf = projet.publication && projet.publication.supabase;
  if (!conf) return erreur('<h2>Espace organisateur non activé</h2><p class="muet">Le studio doit activer la base des invités (Réglages → Base des invités) puis republier l\'invitation.</p>');
  const fiche = projet.fiche || {};
  const mg = fiche.langue === 'mg';
  document.title = 'Organisateur — ' + (fiche.titre || '');
  $('#titre').textContent = fiche.titre || 'Invitation';
  const dateTxt = fiche.date ? new Date(fiche.date + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '';
  $('#sous-titre').textContent = [dateTxt, fiche.date_limite ? 'réponses jusqu\'au ' + new Date(fiche.date_limite + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }) : ''].filter(Boolean).join(' · ');
  const base = location.href.replace(/hote\/.*$/, '');
  const lienFamille = f => base + 'i/?p=' + encodeURIComponent(slug) + '&f=' + encodeURIComponent(f.code);
  const lienGeneral = base + 'i/?p=' + encodeURIComponent(slug);
  const tel = n => String(n || '').replace(/\D/g, '').replace(/^0/, '261');
  const MSG = mg ? 'Salama {famille}! Faly manasa anareo izahay. Ity ny fanasana: {lien}' : 'Bonjour {famille} ! Nous avons le plaisir de vous inviter. Voici votre invitation : {lien}';
  let modele = localStorage.getItem('hote.msg.' + slug) || MSG;

  /* ---- Données ---- */
  let D = { familles: [], reponses: [] }, filtre = 'tous', cherche = '', onglet = 'invites';
  let vues = null;   // réponses déjà vues : les nouvelles sont annoncées
  const annoncer = () => {
    const rs = D.reponses || [];
    if (vues) {
      const nouv = rs.filter(r => !vues.has(r.id)).slice(0, 4);
      nouv.forEach((r, k) => setTimeout(() => toast((r.presence === 'oui' ? '✓ ' : '✗ ') + (r.nom || 'Quelqu\'un') + (r.presence === 'oui' ? ' vient : ' + (r.adultes || 0) + ' adulte(s), ' + (r.enfants || 0) + ' enfant(s)' : ' ne vient pas'), 5000), k * 3200));
      if (nouv.length) { document.title = '(' + nouv.length + ') ' + document.title.replace(/^\(\d+\) /, ''); try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} }
    }
    vues = new Set(rs.map(r => r.id));
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = document.title.replace(/^\(\d+\) /, ''); });
  const lire = async (silencieux) => {
    try { D = await Base.rpc(conf, 'inv_hote_lire', { p_evt: projet.id, p_cle: cle }); try { localStorage.setItem('hote.donnees.' + slug, JSON.stringify(D)); } catch (er) {} $('#indispo').hidden = true; annoncer(); rendre(); $('.etat-sync') && ($('.etat-sync').textContent = 'À jour · ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })); }
    catch (e) {
      // base de données changée : tant que le studio n'a pas recopié cet événement, on patiente au lieu de dire « invalide »
      if (/invalide|inconnu/i.test(e.message) && !D.familles.length) { try { const n = await Base.confActuelle(conf); if (n && n.url !== conf.url) { const z = $('#indispo'); z.hidden = false; z.innerHTML = `<h2>⏳ Transfert en cours</h2><p>Le studio installe une nouvelle base de données. Votre liste d'invités y est recopiée dès que le studio qui a publié l'invitation est ouvert.</p><p class="muet">Cette page réessaie toute seule régulièrement. Vous pouvez la laisser ouverte.</p>`; return; } } catch (er) {} }
      if (/invalide/.test(e.message)) return erreur('<h2>Lien organisateur invalide</h2><p class="muet">Demandez au studio le lien organisateur à jour.</p>'); if (!D.familles.length) { try { const c = JSON.parse(localStorage.getItem('hote.donnees.' + slug)); if (c) { D = c; rendre(); toast('Hors connexion : dernière liste enregistrée sur cet appareil', 4000); return; } } catch (er) {} } const bloq = /restricted|quota|exceed|402|503|Failed to fetch|NetworkError|Load failed/i.test(e.message || '');
      if (bloq && !D.familles.length) { const z = $('#indispo'); z.hidden = false; z.innerHTML = `<h2>⏳ Liste des invités momentanément indisponible</h2><p>Le service qui garde les réponses des invités est saturé pour le moment. <b>Rien n'est perdu</b> : vos invités, leurs réponses et cette page reviendront dès qu'il sera rétabli.</p><p class="muet">Cette page réessaie toute seule régulièrement. Vous pouvez la laisser ouverte.</p>`; return; }
      if (!silencieux) toast(bloq ? 'Service des réponses momentanément indisponible : nouvel essai dans un instant' : 'Connexion impossible : ' + e.message); }
  };
  // Connexion coupée : les familles ajoutées / modifiées restent sur cet appareil et partent dès que la connexion revient
  const cleAtt = 'hote.attente.' + slug;
  const attente = () => { try { return JSON.parse(localStorage.getItem(cleAtt)) || []; } catch (e) { return []; } };
  const mettreAtt = l => { try { if (l.length) localStorage.setItem(cleAtt, JSON.stringify(l)); else localStorage.removeItem(cleAtt); } catch (e) {} };
  const coupure = e => !navigator.onLine || /fetch|network|réseau|load failed|timeout|abort/i.test((e && e.message) || '');
  const envoyer = async liste => {
    try { await Base.rpc(conf, 'inv_hote_familles', { p_evt: projet.id, p_cle: cle, p_familles: liste }); }
    catch (e) {
      if (!coupure(e)) throw e;
      const m = new Map(attente().map(f => [f.code, f])); liste.forEach(f => m.set(f.code, f)); mettreAtt([...m.values()]);
      if (D && D.familles) { liste.forEach(f => { const i = D.familles.findIndex(x => x.code === f.code); if (i >= 0) D.familles[i] = Object.assign({}, D.familles[i], f); else D.familles.push(f); }); rendre(); }
      toast('Pas de connexion : enregistré sur cet appareil, envoyé tout seul quand la connexion revient', 5000); toastFixe = Date.now() + 2500; return;
    }
    await lire(true);
  };
  let envoiAtt = false;
  const viderAttente = async () => {
    const l = attente(); if (!l.length || !navigator.onLine || envoiAtt) return; envoiAtt = true;
    try { await Base.rpc(conf, 'inv_hote_familles', { p_evt: projet.id, p_cle: cle, p_familles: l }); mettreAtt([]); toast('✓ ' + l.length + ' famille(s) enregistrée(s) hors connexion : envoyée(s)', 4000); await lire(true); } catch (e) {}
    envoiAtt = false;
  };
  window.addEventListener('online', viderAttente); setInterval(viderAttente, 30000); setTimeout(viderAttente, 3000);

  /* ---- Affichage ---- */
  const somme = (l, k) => l.reduce((s, f) => s + (Number(f[k]) || 0), 0);
  // adultes / enfants invités : ce que l'organisateur a prévu (sinon : toutes les places comptent comme adultes)
  const invA = f => f.prevus_adultes != null ? Number(f.prevus_adultes) || 0 : (f.prevus_enfants != null ? Math.max(0, (Number(f.places) || 0) - (Number(f.prevus_enfants) || 0)) : Number(f.places) || 0);
  const invE = f => f.prevus_enfants != null ? Number(f.prevus_enfants) || 0 : 0;
  const sommeF = (l, fn) => l.reduce((s, f) => s + fn(f), 0);
  const baseAJour = () => !(D.familles || []).length || ('prevus_adultes' in D.familles[0]);
  const STAT = { vient: 'Vient', non: 'Ne vient pas', attente: 'En attente' };
  /* ---- Catégories : proposées d'office, modifiables, et celles déjà utilisées ---- */
  const PRESETS = mg
    ? ["Fianakaviana avy amin'ny ray", "Fianakaviana avy amin'ny reny", 'Namana', 'Mpiara-miasa', 'Mpiray fiangonana', 'Mpifanolobodirindrina']
    : ['Famille du père', 'Famille de la mère', 'Amis', 'Collègues', 'Église', 'Voisins'];
  const cleCat = 'hote.cat.' + slug;
  const lireCat = () => { try { return JSON.parse(localStorage.getItem(cleCat)) || null; } catch (e) { return null; } };
  const ecrireCat = l => { try { localStorage.setItem(cleCat, JSON.stringify(l)); } catch (e) {} };
  function categories() {
    const base = lireCat() || PRESETS;
    const utilisees = (D.familles || []).map(f => (f.categorie || '').trim()).filter(Boolean);
    return [...new Set(base.concat(utilisees))];
  }
  let filtreCat = '', filtreCote = '';
  // « Côté » : d'après les hôtes de la Fiche (ex. Côté Tsidy / Côté Njara), plus « Commun »
  const COTES = (() => { const h = ((projet.fiche && projet.fiche.hotes) || []).map(x => String((x && (x.surnom || x.nom_complet)) || x || '').trim()).filter(Boolean);
    const l = [...new Set(h)].slice(0, 4).map(n => (mg ? 'Avy amin\'i ' : 'Côté ') + n); return (l.length > 1 ? l : (mg ? ['Avy amin\'ny lahy', 'Avy amin\'ny vavy'] : ['Côté marié', 'Côté mariée'])).concat(mg ? ['Iombonana'] : ['Commun']); })();
  const gereEnvoi = () => (D.familles || []).some(f => 'envoye' in f);
  // invitation envoyée (lien copié, partagé ou WhatsApp) : notée une fois
  const marquerEnvoye = f => { if (!gereEnvoi() || f.envoye) return; f.envoye = new Date().toISOString(); envoyer([Object.assign({}, f)]).catch(() => {}); };
  function tablesConnues() {
    const pt = projet.plan_tables || {}, noms = new Set();
    for (let i = 1; i <= (Number(pt.n) || 0); i++) noms.add(String(i));
    (D.familles || []).forEach(f => { const t = String(f.table || '').trim(); if (t) noms.add(t); });
    return [...noms].sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
  }
  async function toutSupprimer() {
    const fs = D.familles || [];
    if (!fs.length || !confirm('Supprimer TOUTE la liste (' + fs.length + ' familles) ?')) return;
    if (prompt('Pour confirmer, écrivez SUPPRIMER') !== 'SUPPRIMER') return toast('Rien n\'a été supprimé');
    let n = 0; for (const f of fs) { try { await Base.rpc(conf, 'inv_hote_supprimer', { p_evt: projet.id, p_cle: cle, p_code: f.code }); n++; } catch (e) { toast(e.message); break; } }
    toast(n + ' famille(s) supprimée(s)'); lire(true);
  }
  function rendre() {
    const fs = D.familles || [], rs = D.reponses || [];
    const vient = fs.filter(f => f.statut === 'vient'), non = fs.filter(f => f.statut === 'non'), att = fs.filter(f => f.statut !== 'vient' && f.statut !== 'non');
    const generaux = rs.filter(r => !r.code && r.presence === 'oui');
    const persVient = somme(vient, 'adultes') + somme(vient, 'enfants') + somme(generaux, 'adultes') + somme(generaux, 'enfants');
    const parCat = c => fs.filter(f => (f.categorie || '') === c);
    const catsUtil = categories().filter(c => parCat(c).length).concat(parCat('').length ? [''] : []);
    if (filtreCat !== '' && filtreCat !== '∅' && !catsUtil.includes(filtreCat)) filtreCat = '';

  async function copier(t) { try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } toast('Lien copié'); }

  function formulaire(f) {
    const n = !f; f = f || { code: Base.code(), nom: '', categorie: '', places: 2, prevus_adultes: 2, prevus_enfants: 0, telephone: '', table: '', statut: 'attente', adultes: 0, enfants: 0 };
    const d = $('#dlg'), fo = $('#dlg-form');
    fo.innerHTML = `<h3>${n ? 'Ajouter une famille' : 'Modifier'}</h3>
      <label>Nom de la famille<input name="nom" required value="${esc(f.nom)}" placeholder="Ex. Fianakaviana Rakoto"></label>
      <div class="lien-fam"><span>🔗 Lien personnel de cette famille${n ? ' <small>(actif dès que vous enregistrez)</small>' : ''}</span><div class="outils" style="margin:0"><input type="text" readonly value="${esc(lienFamille(f))}" onclick="this.select()" style="flex:1"><button type="button" class="btn petit" id="f-cp-lien">Copier</button></div></div>
      <label>Catégorie<select name="categorie" id="f-cat"><option value="">— Sans catégorie —</option>${categories().map(c => `<option ${(f.categorie || (n && filtreCat !== '∅' ? filtreCat : '')) === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__nouvelle">＋ Nouvelle catégorie…</option></select></label>
      <label id="f-cat-nouv" hidden>Nom de la nouvelle catégorie<input name="nouvelle_cat" placeholder="${mg ? 'Ohatra : Mpianatra niara-nianatra' : 'Ex. : Anciens camarades de classe'}"></label>
      <div class="deux"><label>Adultes invités<input name="prevus_adultes" type="number" min="0" value="${invA(f)}"></label><label>Enfants invités<input name="prevus_enfants" type="number" min="0" value="${invE(f)}"></label></div>
      <div class="deux"><label>Téléphone (WhatsApp)<input name="telephone" inputmode="tel" value="${esc(f.telephone || '')}" placeholder="034 00 000 00"></label><label>Table<input name="table" list="f-tables" value="${esc(f.table || '')}" placeholder="Sans table"><datalist id="f-tables">${tablesConnues().map(t => `<option value="${esc(t)}">`).join('')}</datalist></label></div>
      <label>Côté<select name="cote"><option value="">À classer</option>${COTES.map(c => `<option ${f.cote === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label>Réponse<select name="statut">${Object.entries(STAT).map(([k, t]) => `<option value="${k}" ${(f.statut || 'attente') === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <div class="deux"><label>Adultes qui viennent<input name="adultes" type="number" min="0" value="${f.adultes || 0}"></label><label>Enfants qui viennent<input name="enfants" type="number" min="0" value="${f.enfants || 0}"></label></div>
      <div class="outils" style="margin:6px 0 0;justify-content:flex-end"><button class="btn" value="annuler" formnovalidate>Annuler</button><button class="btn plein" value="ok">Enregistrer</button></div>`;
    $('#f-cp-lien').onclick = () => { copier(lienFamille(f)); if (!n) marquerEnvoye(f); };
    $('#f-cat').onchange = e => { const nv = e.target.value === '__nouvelle'; $('#f-cat-nouv').hidden = !nv; if (nv) $('#f-cat-nouv input').focus(); };
    d.showModal();
    d.onclose = async () => {
      if (d.returnValue !== 'ok') return;
      const x = Object.fromEntries(new FormData(fo).entries());
      if (!x.nom.trim()) return;
      if (x.categorie === '__nouvelle') { x.categorie = (x.nouvelle_cat || '').trim(); if (x.categorie) ecrireCat([...new Set(categories().concat(x.categorie))]); }
      delete x.nouvelle_cat;
      const pa = Number(x.prevus_adultes) || 0, pe = Number(x.prevus_enfants) || 0;
      const nf = Object.assign({}, f, x, { nom: x.nom.trim(), prevus_adultes: pa, prevus_enfants: pe, places: Math.max(1, pa + pe), adultes: Number(x.adultes) || 0, enfants: Number(x.enfants) || 0 });
      try { await envoyer([nf]); toast(n ? 'Famille ajoutée' : 'Enregistré'); if (n) setTimeout(() => lienNouvelle(nf), 300); }
      catch (e) { toast(e.message); }
    };
  }
  // Après l'ajout : le lien personnel de la famille, prêt à envoyer (sa réponse dira combien de personnes viennent)
  function lienNouvelle(f) {
    const d = $('#dlg'), fo = $('#dlg-form'), l = lienFamille(f);
    const msg = modele.replace('{famille}', f.nom).replace('{lien}', l);
    fo.innerHTML = `<h3>Lien de « ${esc(f.nom)} »</h3>
      <p class="muet" style="margin:0">Ce lien est <b>à elle seule</b> : son nom s'affiche sur l'invitation et, quand elle confirme, vous voyez ici <b>combien d'adultes et d'enfants viennent</b> (au plus ${invA(f)} adulte(s)${invE(f) ? ' et ' + invE(f) + ' enfant(s)' : ''}).</p>
      <input type="text" readonly value="${esc(l)}" onclick="this.select()">
      <div class="outils" style="margin:0">${f.telephone ? `<a class="btn wa" target="_blank" id="nl-wa" href="https://wa.me/${tel(f.telephone)}?text=${encodeURIComponent(msg)}">Envoyer sur WhatsApp</a>` : `<a class="btn wa" target="_blank" id="nl-wa" href="https://wa.me/?text=${encodeURIComponent(msg)}">WhatsApp</a>`}<button type="button" class="btn plein" id="nl-cp">Copier le lien</button><button type="button" class="btn" id="nl-part">📤 Partager</button><a class="btn" target="_blank" href="${esc(l)}">Voir</a></div>
      <div class="outils" style="margin:6px 0 0;justify-content:flex-end"><button class="btn" value="ok">Fermer</button></div>`;
    const fam = () => (D.familles || []).find(x => x.code === f.code) || f;
    $('#nl-cp', fo).onclick = () => { copier(l); marquerEnvoye(fam()); };
    $('#nl-wa', fo).onclick = () => marquerEnvoye(fam());
    $('#nl-part', fo).onclick = e => { Base.partager(e.currentTarget, l, modele.replace('{famille}', f.nom).replace('{lien}', '').trim()); marquerEnvoye(fam()); };
    d.onclose = null; d.showModal();
  }
  function gererCategories() {
    const d = $('#dlg'), fo = $('#dlg-form');
    const fs = D.familles || [];
    const ligne = c => { const l = fs.filter(f => f.categorie === c), v = l.filter(f => f.statut === 'vient');
      return `<div class="cat-ligne" data-cat="${esc(c)}"><input value="${esc(c)}" aria-label="Nom de la catégorie"><span class="muet">${l.length} fam.${v.length ? ' · ' + (somme(v, 'adultes') + somme(v, 'enfants')) + ' viennent' : ''}</span><button type="button" class="btn petit danger" data-suppr-cat>✕</button></div>`; };
    fo.innerHTML = `<h3>Catégories</h3>
      <p class="muet" style="margin:0">Renommez une catégorie en modifiant son nom : toutes ses familles suivent. ✕ la retire (ses familles passent « sans catégorie »).</p>
      <div id="cats" style="display:flex;flex-direction:column;gap:6px">${categories().map(ligne).join('')}</div>
      <div class="outils" style="margin:0"><input id="cat-nouv" placeholder="Nouvelle catégorie" style="flex:1"><button type="button" class="btn" id="cat-ajout">＋ Ajouter</button></div>
      <div class="outils" style="margin:6px 0 0;justify-content:flex-end"><button type="button" class="btn" id="cat-defaut">Remettre les catégories proposées</button><button class="btn plein" value="ok">Terminé</button></div>`;
    const enregistrerNoms = async () => {
      const renommer = [];
      const noms = $$('.cat-ligne', fo).map(l => { const ancien = l.dataset.cat, nouveau = $('input', l).value.trim() || ancien; if (nouveau !== ancien) fs.filter(f => f.categorie === ancien).forEach(f => renommer.push(Object.assign({}, f, { categorie: nouveau }))); return nouveau; });
      ecrireCat([...new Set(noms)]);
      if (renommer.length) { try { await envoyer(renommer); toast(renommer.length + ' famille(s) mises à jour'); } catch (e) { toast(e.message); } }
    };
    $('#cat-ajout', fo).onclick = () => { const v = $('#cat-nouv', fo).value.trim(); if (!v) return; $('#cats', fo).insertAdjacentHTML('beforeend', ligne(v)); $('#cat-nouv', fo).value = ''; lier(); };
    $('#cat-defaut', fo).onclick = () => { const exist = $$('.cat-ligne', fo).map(l => l.dataset.cat); PRESETS.filter(c => !exist.includes(c)).forEach(c => $('#cats', fo).insertAdjacentHTML('beforeend', ligne(c))); lier(); };
    const lier = () => $$('[data-suppr-cat]', fo).forEach(b => b.onclick = async () => {
      const l = b.closest('.cat-ligne'), c = l.dataset.cat, fams = fs.filter(f => f.categorie === c);
      if (fams.length && !confirm(`Retirer « ${c} » ? Ses ${fams.length} famille(s) passeront « sans catégorie ».`)) return;
      l.remove();
      if (fams.length) { try { await envoyer(fams.map(f => Object.assign({}, f, { categorie: '' }))); } catch (e) { toast(e.message); } }
    });
    lier();
    d.showModal();
    d.onclose = async () => { await enregistrerNoms(); rendre(); };
  }
  function importer() {
    if (!window.XLSX) return toast('Lecture Excel en cours de chargement, réessayez');
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.xlsx,.xls,.csv';
    i.onchange = async () => {
      const wb = XLSX.read(await i.files[0].arrayBuffer());
      const lignes = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      const cle = (o, ...ks) => { for (const k of Object.keys(o)) if (ks.some(x => k.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(x))) return o[k]; return ''; };
      const exist = new Set((D.familles || []).map(f => f.nom.toLowerCase()));
      const liste = lignes.map(o => ({ code: Base.code(), nom: String(cle(o, 'famille', 'nom', 'anarana')).trim(), categorie: String(cle(o, 'categ', 'groupe')).trim(), prevus_adultes: cle(o, 'adulte', 'olon-dehibe') === '' ? null : Number(cle(o, 'adulte', 'olon-dehibe')) || 0, prevus_enfants: cle(o, 'enfant', 'ankizy') === '' ? null : Number(cle(o, 'enfant', 'ankizy')) || 0, places: Number(cle(o, 'place', 'nombre', 'isa')) || (Number(cle(o, 'adulte', 'olon-dehibe')) || 0) + (Number(cle(o, 'enfant', 'ankizy')) || 0) || 1, telephone: String(cle(o, 'tel', 'phone', 'whatsapp', 'finday')).trim(), table: String(cle(o, 'table', 'latabatra')).trim() })).filter(f => f.nom && !exist.has(f.nom.toLowerCase()));
      if (!liste.length) return toast('Aucune nouvelle famille trouvée (colonne « Famille » ou « Nom »)');
      try { await envoyer(liste); toast(liste.length + ' famille(s) importée(s)'); } catch (e) { toast(e.message); }
    };
    i.click();
  }
  function exporter() {
    if (!window.XLSX) return toast('Excel en cours de chargement, réessayez');
    const rows = (D.familles || []).map(f => ({ Famille: f.nom, 'Côté': f.cote || '', 'Invitation envoyée': f.envoye ? new Date(f.envoye).toLocaleString('fr-FR') : '', 'Catégorie': f.categorie, 'Adultes invités': invA(f), 'Enfants invités': invE(f), 'Téléphone': f.telephone, Table: f.table, 'Réponse': STAT[f.statut] || STAT.attente, 'Adultes qui viennent': f.adultes, 'Enfants qui viennent': f.enfants, Message: f.message || '', Lien: lienFamille(f) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Invités');
    const g = (D.reponses || []).filter(r => !r.code).map(r => ({ Nom: r.nom, 'Réponse': r.presence === 'oui' ? 'Vient' : 'Ne vient pas', Adultes: r.adultes, Enfants: r.enfants, Message: r.message, Date: new Date(r.date).toLocaleString('fr-FR') }));
    if (g.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(g), 'Lien général');
    const pers = f => f.statut === 'vient' ? (Number(f.adultes) || 0) + (Number(f.enfants) || 0) : invA(f) + invE(f) || Number(f.places) || 1;
    const tl = []; tablesConnues().forEach(t => (D.familles || []).filter(f => f.statut !== 'non' && String(f.table || '').trim() === t).forEach(f => tl.push({ Table: t, Famille: f.nom, Personnes: pers(f), 'Réponse': STAT[f.statut] || STAT.attente })));
    if (tl.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tl), 'Tables');
    XLSX.writeFile(wb, 'invites-' + slug + '.xlsx');
  }

  await lire();
  setInterval(() => { if (!document.hidden && !$('#dlg').open) lire(true); }, 15000);
})();
</script>
