<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Invitation</title>
<meta property="og:title" content="Vous êtes invités">
<meta property="og:image" content="../fonds/fond_2.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Montserrat:wght@400;600&family=Parisienne&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --vin: #7a1f2b; --creme: #f4ede2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1d1414; overflow: hidden; font-family: "Cormorant Garamond", serif; }
  #fond-flou { position: fixed; inset: -40px; background: center/cover no-repeat; filter: blur(30px) brightness(.55); }
  #scene { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); height: 100dvh; max-width: 100vw; aspect-ratio: 9/16; box-shadow: 0 0 60px rgba(0,0,0,.5); }
  @media (max-aspect-ratio: 9/16) { #scene { width: 100vw; height: auto; } }
  #ecran-ouvrir { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(20,10,10,.35); color: #fff; text-align: center; padding: 24px; cursor: pointer; }
  #ecran-ouvrir .titre { font-family: "Great Vibes", cursive; font-size: clamp(40px, 11vw, 64px); text-shadow: 0 2px 12px rgba(0,0,0,.6); line-height: 1.1; }
  #ecran-ouvrir .bouton { font: 600 20px "Cormorant Garamond", serif; background: var(--vin); color: #fff; border: 0; border-radius: 999px; padding: 14px 30px; box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  #son { position: fixed; z-index: 15; left: 12px; bottom: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); color: var(--vin); font-size: 20px; display: none; }
  #bandeau { position: fixed; z-index: 25; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(92vw, 440px); background: #fffaf3; color: #3a2323; border-radius: 16px; padding: 16px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.4); font-size: 18px; display: none; }
  #bandeau b { color: var(--vin); }
  #bandeau .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #bandeau a, #bandeau button { font: 600 16px "Cormorant Garamond", serif; flex: 1; text-align: center; padding: 10px 12px; border-radius: 999px; border: 1.5px solid var(--vin); color: var(--vin); background: #fff; text-decoration: none; cursor: pointer; }
  #bandeau a.plein { background: var(--vin); color: #fff; }
  .langues { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 420px; }
  .langues button { font: 600 15px Inter, system-ui, sans-serif; background: rgba(255,255,255,.18); color: #fff; border: 1.5px solid rgba(255,255,255,.65); border-radius: 999px; padding: 7px 14px; cursor: pointer; backdrop-filter: blur(4px); }
  .langues button.actif { background: #fff; color: var(--vin); border-color: #fff; }
  #btn-langue { position: fixed; z-index: 16; right: 12px; top: 12px; height: 40px; border-radius: 999px; border: 0; background: rgba(255,255,255,.88); color: var(--vin); font: 600 14px Inter, system-ui, sans-serif; padding: 0 14px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; }
  #menu-langue { position: fixed; z-index: 30; right: 12px; top: 58px; background: #fffaf3; border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: none; flex-direction: column; min-width: 170px; }
  #menu-langue button { font: 500 15px Inter, system-ui, sans-serif; background: none; border: 0; text-align: left; padding: 10px 12px; border-radius: 10px; color: #3a2323; cursor: pointer; }
  #menu-langue button.actif { background: var(--vin); color: #fff; }
  #erreur { color: #fff; position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 20px; }
</style>
</head>
<body>
<div id="fond-flou"></div>
<div id="scene"></div>
<div id="ecran-ouvrir"><div class="titre" id="titre-ouvrir">Vous êtes invités</div><div class="langues" id="langues-ouvrir" hidden></div><button class="bouton" id="btn-ouvrir">Ouvrir l'invitation</button></div>
<button id="btn-langue" aria-label="Langue">🌐</button><div id="menu-langue" role="menu"></div>
<button id="son" aria-label="Son">♪</button>
<div id="bandeau" role="dialog"></div>
<div id="erreur"></div>
<script src="../config.js?v=202610311317"></script>
<script src="../moteur/moteur.js?v=202610311317"></script>
<script src="../moteur/fabrique.js?v=202610311317"></script>
<script src="../moteur/base.js?v=202610311317"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const slug = q.get('p'), code = q.get('f'), apercu = q.get('apercu');
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const montrerErreur = t => { const e = $('#erreur'); e.textContent = t; e.style.display = 'flex'; $('#ecran-ouvrir').style.display = 'none'; };

  /* ---- Charger le projet ---- */
  let projet = null;
  try {
    if (apercu) {
      projet = JSON.parse(localStorage.getItem('studio.apercu') || 'null');
    } else if (slug) {
      try { const r = await fetch('../projets/' + encodeURIComponent(slug) + '.json?v=' + Date.now()); if (r.ok) projet = await r.json(); } catch (e) { /* ouvert depuis un dossier : on essaie le fichier .js */ }
      if (!projet) {
        await new Promise(ok => { const sc = document.createElement('script'); sc.src = '../projets/' + encodeURIComponent(slug) + '.js?v=' + Date.now(); sc.onload = ok; sc.onerror = ok; document.head.appendChild(sc); });
        projet = window.PROJETS && window.PROJETS[slug] ? JSON.parse(JSON.stringify(window.PROJETS[slug])) : null;
      }
    }
  } catch (e) { console.error(e); }
  if (!projet) return montrerErreur('Invitation introuvable. Vérifiez le lien reçu.');

  const fiche = projet.fiche || {};
  const L = Fabrique.LIB[fiche.langue] || Fabrique.LIB.fr;
  document.title = fiche.titre || 'Invitation';
  /* ---- Langues : l'invité choisit, tout bascule d'un clic ---- */
  const NOMS = (window.MoteurInfo && MoteurInfo.LANGUES) || { mg: 'Malagasy', fr: 'Français', en: 'English' };
  const langues = (projet.langues && projet.langues.length ? projet.langues : [fiche.langue || 'fr']).filter((l, i, a) => a.indexOf(l) === i);
  let LG = (() => { try { const l = localStorage.getItem('inv.langue.' + (slug || 'apercu')); if (langues.includes(l)) return l; } catch (e) {} const nav = (navigator.languages || [navigator.language || '']).map(x => String(x).slice(0, 2).toLowerCase()).find(x => langues.includes(x)); return nav || langues[0]; })();
  const tr = (mg, fr, en) => LG === 'mg' ? mg : LG === 'fr' ? fr : en;
  const OUVRIR = { mg: 'Sokafy ny fanasana', fr: "Ouvrir l'invitation", en: 'Open the invitation', de: 'Einladung öffnen', it: "Apri l'invito", es: 'Abrir la invitación', pt: 'Abrir o convite', zh: '打开邀请函', ar: 'افتح الدعوة', ru: 'Открыть приглашение', ja: '招待状を開く' };
  let moteurPret = null;
  function appliquerLangue(l, memo) {
    LG = l; document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    $('#btn-ouvrir').textContent = OUVRIR[l] || OUVRIR.en;
    $('#btn-langue').textContent = '🌐 ' + l.toUpperCase();
    $$('#langues-ouvrir button, #menu-langue button').forEach(b => b.classList.toggle('actif', b.dataset.l === l));
    if (memo) { try { localStorage.setItem('inv.langue.' + (slug || 'apercu'), l); } catch (e) {} }
    if (moteurPret) moteurPret.changerLangue(l);
  }
  $('#titre-ouvrir').textContent = fiche.titre || 'Invitation';
  if (langues.length > 1) {
    const btns = langues.map(l => `<button type="button" data-l="${l}">${NOMS[l] || l}</button>`).join('');
    $('#langues-ouvrir').innerHTML = btns; $('#langues-ouvrir').hidden = false;
    $('#menu-langue').innerHTML = btns;
    $$('#langues-ouvrir button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); appliquerLangue(b.dataset.l, true); }));
    $$('#menu-langue button').forEach(b => b.onclick = () => { appliquerLangue(b.dataset.l, true); $('#menu-langue').style.display = 'none'; });
    $('#btn-langue').onclick = e => { e.stopPropagation(); const m = $('#menu-langue'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; };
    document.addEventListener('click', () => { $('#menu-langue').style.display = 'none'; });
  }
  appliquerLangue(LG);

  let famille = null;
  const sbConf = !apercu && projet.publication && projet.publication.supabase;
  if (code && projet.liens && projet.liens[code]) famille = Object.assign({ code }, projet.liens[code]);
  // Familles ajoutées ensuite par l'organisateur (espace organisateur) : lues dans la base
  if (code && sbConf) { try { const f = await Base.rpc(sbConf, 'inv_famille', { p_evt: projet.id, p_code: code }); if (f) famille = Object.assign({}, famille || {}, f); } catch (e) { console.warn('Base', e); } }
  if (apercu && q.get('test') === '1') famille = { code: 'TEST', nom: 'Fianakaviana Rakoto', places: 4, adultes: 2, enfants: 2 };

  /* ---- Date limite ---- */
  const clos = fiche.date_limite && Date.now() > Date.parse(fiche.date_limite + 'T23:59:59+03:00');
  if (clos) {
    projet.plans.forEach(p => {
      if (p.role !== 'confirmation') return;
      p.calques = p.calques.filter(c => !(c.type === 'compteur' || c.action === 'confirmer' || c.action === 'refuser' || c.action === 'whatsapp'));
      const noms = (fiche.contacts || []).map(c => c.nom).join(fiche.langue === 'mg' ? ' na ' : ' ou ');
      const closTr = { mg: `Efa nikatona ny famaliana nanomboka ny {date_limite}. Raha misy fanontaniana, antsoy i ${(fiche.contacts || []).map(c => c.nom).join(' na ')}.`, fr: `Les réponses sont closes depuis le {date_limite}. Pour toute information, appelez ${(fiche.contacts || []).map(c => c.nom).join(' ou ')}.`, en: `Replies closed on {date_limite}. For any question, please call ${(fiche.contacts || []).map(c => c.nom).join(' or ')}.` };
      p.calques.push({ id: 'clos', type: 'texte', trad: closTr, texte: fiche.langue === 'mg' ? `Efa nikatona ny famaliana nanomboka ny {date_limite}. Raha misy fanontaniana, antsoy i ${noms}.` : `Les réponses sont closes depuis le {date_limite}. Pour toute information, appelez ${noms}.`, x: 50, y: 52, largeur: 70, taille: 3, couleur: '#7a1f2b', fond_couleur: '#ffffff', fond_opacite: .75, gras: true, animation: 'fondu', debut: .3 });
    });
  }

  /* ---- Firebase (facultatif) ---- */
  const fbConf = (projet.publication && projet.publication.firebase) || (window.STUDIO_CONFIG && window.STUDIO_CONFIG.firebase);
  let db = null;
  async function chargerScript(src) { return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
  if (fbConf && !apercu) {
    try {
      await chargerScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await chargerScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
      firebase.initializeApp(fbConf);
      db = firebase.firestore();
      db.collection('evenements').doc(projet.id).collection('vues').add({ fid: famille ? famille.code : 'general', famille: famille ? famille.nom : 'Lien général', action: 'ouverture', date: new Date().toISOString(), appareil: navigator.userAgent.slice(0, 120) }).catch(() => {});
    } catch (e) { console.warn('Firebase indisponible', e); db = null; }
  }
  function noter(action) { if (db) db.collection('evenements').doc(projet.id).collection('vues').add({ fid: famille ? famille.code : 'general', famille: famille ? famille.nom : 'Lien général', action, date: new Date().toISOString() }).catch(() => {}); }

  /* ---- Moteur ---- */
  const fondImg = (projet.plans.find(p => p.role !== 'ouverture') || projet.plans[0] || {}).fond;
  if (fondImg && fondImg.media && !/^idb:/.test(fondImg.media)) $('#fond-flou').style.backgroundImage = `url(../${fondImg.media.replace(/\.mp4$/, '.jpg')})`;
  async function resoudre(src) {
    if (!src) return null;
    if (/^idb:/.test(src)) {
      const db = await new Promise((ok, ko) => { const r = indexedDB.open('studio', 1); r.onupgradeneeded = () => r.result.createObjectStore('fichiers'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
      const blob = await new Promise(ok => { const r = db.transaction('fichiers').objectStore('fichiers').get(src); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); });
      return blob ? URL.createObjectURL(blob) : null;
    }
    if (/^(https?:|blob:|data:)/.test(src)) return src;
    return '../' + src;
  }
  const moteur = new Moteur($('#scene'), { resolveur: resoudre, mode: 'invitation', famille, onAction });
  await moteur.setProjet(projet);
  moteurPret = moteur; moteur.changerLangue(LG);
  if (langues.length > 1) $('#btn-langue').style.display = 'block';
  moteur.afficherPlan(0, 0.01);

  let musique = null;
  if (projet.musique && projet.musique.src) {
    musique = new Audio(await resoudre(projet.musique.src));
    const debutM = Number(projet.musique.debut) || 0;
    musique.volume = projet.musique.volume != null ? projet.musique.volume : .8;
    musique.addEventListener('loadedmetadata', () => { if (debutM) musique.currentTime = debutM; }, { once: true });
    musique.addEventListener('ended', () => { musique.currentTime = debutM; musique.play().catch(() => {}); });
    $('#son').style.display = 'block';
    $('#son').onclick = () => { if (musique.paused) { musique.play(); $('#son').textContent = '♪'; } else { musique.pause(); $('#son').textContent = '×'; } };
  }
  $('#ecran-ouvrir').addEventListener('click', () => {
    $('#ecran-ouvrir').style.display = 'none';
    if (musique) musique.play().catch(() => {});
    moteur.jouer(moteur.plansInvitation(), 0);
  });

  /* ---- Actions des boutons ---- */
  const tel = n => String(n || '').replace(/\D/g, '').replace(/^0/, '261');
  function bandeau(html) { const b = $('#bandeau'); b.innerHTML = html; b.style.display = 'block'; b.querySelectorAll('[data-fermer]').forEach(x => x.onclick = () => { b.style.display = 'none'; }); }
  function messageReponse(presence, form) {
    const nom = famille ? famille.nom : '';
    if (fiche.langue === 'mg') return presence ? `Salama! ${nom}: ho tonga izahay. Olon-dehibe ${form.adultes || 0}, ankizy ${form.enfants || 0}. Misaotra!` : `Salama! ${nom}: miala tsiny fa tsy ho afaka izahay. Misaotra tamin'ny fanasana!`;
    return presence ? `Bonjour ! ${nom} : nous serons présents. Adultes ${form.adultes || 0}, enfants ${form.enfants || 0}. Merci !` : `Bonjour ! ${nom} : nous ne pourrons malheureusement pas venir. Merci pour l'invitation !`;
  }
  let erreurBase = '';
  async function enregistrer(presence, form) {
    if (sbConf) {
      try {
        await Base.rpc(sbConf, 'inv_repondre', { p_evt: projet.id, p_code: famille ? famille.code : null, p_nom: famille ? famille.nom : (form.nom || form.famille || ''), p_presence: presence ? 'oui' : 'non', p_adultes: Number(form.adultes) || 0, p_enfants: Number(form.enfants) || 0, p_message: form.message || '' });
        return true;
      } catch (e) { console.warn(e); erreurBase = e.message; if (/places/.test(e.message)) return 'places'; }
    }
    if (!db) return false;
    try {
      await db.collection('evenements').doc(projet.id).collection('reponses').add({ fid: famille ? famille.code : 'general', famille: famille ? famille.nom : '', presence: presence ? 'oui' : 'non', adultes: Number(form.adultes) || 0, enfants: Number(form.enfants) || 0, source: 'lien', date: new Date().toISOString() });
      return true;
    } catch (e) { console.warn(e); return false; }
  }
  async function onAction(action, c, form) {
    const lieux = fiche.lieux || [], contacts = fiche.contacts || [];
    const cible = Number(c.cible) || 0;
    if (action === 'map') { noter('map'); const l = lieux[cible] || lieux[0]; if (l) window.open(l.maps || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(l.nom)), '_blank'); return; }
    if (action === 'appeler') { noter('appel'); const k = contacts[cible] || contacts[0]; if (k) location.href = 'tel:' + k.telephone.replace(/\s/g, ''); return; }
    if (action === 'messenger') { if (c.lien) window.open(c.lien, '_blank'); return; }
    if (action === 'lien') { if (c.lien) window.open(c.lien, '_blank'); return; }
    if (action === 'whatsapp') {
      const k = contacts[cible] || contacts[0]; if (!k) return;
      const msg = fiche.langue === 'mg' ? `Salama! Momba ny fanasana "${fiche.titre}": ` : `Bonjour ! Au sujet de l'invitation « ${fiche.titre} » : `;
      window.open('https://wa.me/' + tel(k.telephone) + '?text=' + encodeURIComponent(msg), '_blank'); return;
    }
    if (action === 'partager') {
      noter('partage');
      const url = location.href.replace(/[?&]f=[^&]+/, '').replace(/[?&]apercu=[^&]+/, '');
      if (navigator.share) { navigator.share({ title: fiche.titre, url }).catch(() => {}); }
      else { navigator.clipboard && navigator.clipboard.writeText(url); bandeau(`<b>${tr('Voadika ny rohy', 'Lien copié', 'Link copied')}</b><div class="actions"><a class="plein" target="_blank" href="https://wa.me/?text=${encodeURIComponent(url)}">WhatsApp</a><a target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Facebook</a><button data-fermer>OK</button></div>`); }
      return;
    }
    if (action === 'calendrier') {
      const d = (fiche.date || '').replace(/-/g, ''), h = (fiche.heure || '08:00').replace(':', '');
      const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART;TZID=Indian/Antananarivo:${d}T${h}00\nSUMMARY:${fiche.titre}\nLOCATION:${(fiche.lieux[0] || {}).nom || ''}\nEND:VEVENT\nEND:VCALENDAR`;
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'invitation.ics'; a.click(); return;
    }
    if (action === 'confirmer' || action === 'refuser') {
      const oui = action === 'confirmer';
      const ok = await enregistrer(oui, form);
      if (ok === 'places') { bandeau(`<b>${tr('Mihoatra ny toerana natokana ho anareo', 'Trop de personnes', 'Too many people')}</b><div style="margin-top:6px">${tr('Toerana ' + (famille.places || '') + ' no natokana ho an\'ny fianakavianareo.', (famille.places || '') + ' place(s) prévue(s) pour votre famille.', (famille.places || '') + ' seat(s) reserved for your family.')}</div><div class="actions"><button data-fermer>OK</button></div>`); return; }
      const k = contacts[0];
      const lienWa = k ? 'https://wa.me/' + tel(k.telephone) + '?text=' + encodeURIComponent(messageReponse(oui, form)) : '';
      const merci = oui ? tr('Misaotra! Voaray ny valinteninareo.', 'Merci ! Votre réponse est enregistrée.', 'Thank you! Your reply has been saved.') : tr('Misaotra nampahafantatra.', 'Merci de nous avoir prévenus.', 'Thank you for letting us know.');
      const envoyer = tr('Alefaso amin\'ny WhatsApp', 'Envoyer sur WhatsApp', 'Send on WhatsApp');
      if (ok) bandeau(`<b>${merci}</b><div class="actions"><button data-fermer>OK</button></div>`);
      else bandeau(`<b>${tr('Alefaso amin\'ny WhatsApp ny valinteninareo', 'Envoyez votre réponse sur WhatsApp', 'Send your reply on WhatsApp')}</b><div style="margin-top:6px">${messageReponse(oui, form)}</div><div class="actions">${lienWa ? `<a class="plein" target="_blank" href="${lienWa}">${envoyer}</a>` : ''}<button data-fermer>${tr('Hidio', 'Fermer', 'Close')}</button></div>`);
      const i = moteur.seq.findIndex(k => projet.plans[k].role === 'remerciement');
      if (i >= 0) setTimeout(() => moteur.allerA(i), 400);
    }
  }
})();
</script>
</body>
</html>
